name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev,rag,api]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Test
        run: pytest

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ASTERIA_UI_TESTS: "1"
      ASTERIA_UI_SCREENSHOTS: artifacts/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install browser test dependencies
        run: python -m pip install -e ".[dev,api,ui]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test interface and real API
        run: python -m pytest tests/test_capstone_ui.py --no-cov
      - name: Keep interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asteria-interface
          path: artifacts/ui
          retention-days: 7

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation
        run: mkdocs build --strict
