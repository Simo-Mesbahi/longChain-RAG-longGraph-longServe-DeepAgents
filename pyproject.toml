[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-deep-agents-course"
version = "0.1.0"
description = "Cours francophone de LangChain aux Deep Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Simo Mesbahi" }]
dependencies = [
  "langchain>=1.0,<2.0",
  "langgraph>=1.2,<1.3",
  "langchain-openai>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "numpy>=1.26,<3.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.11,<1.0",
]
rag = [
  "langchain-chroma>=1.1,<2.0",
]
observability = [
  "langsmith>=0.4,<1.0",
]
agents = [
  "deepagents>=0.6.8,<1.0",
]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
]
docs = [
  "mkdocs-material>=9.6,<10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_course"]

[tool.pytest.ini_options]
addopts = "-q --cov=ai_course --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
